<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>汉字排序 · Latihan Susun Hanzi HSK2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Noto+Serif+SC:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF3E7;
  --paper-2:#F1E7D4;
  --ink:#22293A;
  --ink-soft:#5B6274;
  --jade:#3F7768;
  --jade-deep:#2C5A4E;
  --seal:#B0413E;
  --gold:#C9962F;
  --line:#DCCFAF;
  --card:#FFFDF8;
  --wrong:#B0413E;
  --right:#3F7768;
  --radius:14px;
  --shadow: 0 2px 0 rgba(34,41,58,.05), 0 8px 20px -10px rgba(34,41,58,.25);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 10% -10%, #fffaf0 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #f6ead2 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.cjk{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;}
.display{font-family:'Fraunces',serif;}
.cjk-display{font-family:'Noto Serif SC','Noto Sans SC',serif;}

#app{max-width:760px;margin:0 auto;padding:22px 18px 60px;min-height:100vh;}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:22px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .seal{
  width:38px;height:38px;border-radius:9px;background:var(--seal);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC',serif;font-weight:700;font-size:19px;
  box-shadow: var(--shadow);
  transform:rotate(-3deg);
}
.brand-text .t1{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
.brand-text .t2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.1;}
.student-chip{
  font-size:12.5px;color:var(--ink-soft);background:var(--card);
  border:1px solid var(--line);padding:6px 12px;border-radius:100px;
  display:flex;gap:6px;align-items:center;box-shadow: var(--shadow);
}
.student-chip b{color:var(--ink);font-weight:600;}

/* ---------- generic card & buttons ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px;
}
h1.page-title{
  font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0 0 6px;
  letter-spacing:-.01em;
}
p.page-sub{color:var(--ink-soft);margin:0 0 22px;font-size:15px;line-height:1.5;}

.btn{
  font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
  border:none;cursor:pointer;border-radius:10px;padding:12px 20px;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:active{transform:translateY(1px) scale(.99);}
.btn-primary{background:var(--jade);color:#fff;box-shadow:0 6px 16px -6px rgba(63,119,104,.55);}
.btn-primary:hover{background:var(--jade-deep);}
.btn-primary:disabled{background:#B9C4BE;cursor:not-allowed;box-shadow:none;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--jade);color:var(--jade-deep);}
.btn-seal{background:var(--seal);color:#fff;box-shadow:0 6px 16px -6px rgba(176,65,62,.55);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:13px;}

label.field-label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;}
input.field-input{
  width:100%;font-size:16px;padding:13px 14px;border-radius:10px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);
  font-family:'Inter',sans-serif;
}
input.field-input:focus{outline:2px solid var(--jade);outline-offset:1px;border-color:var(--jade);}

/* ---------- start screen ---------- */
.hero-mark{
  text-align:center;margin-bottom:8px;
}
.hero-mark .glyphs{
  font-family:'Noto Serif SC',serif;font-weight:700;font-size:46px;color:var(--jade-deep);
  letter-spacing:.08em;
}
.hero-mark .sub{color:var(--ink-soft);font-size:13.5px;margin-top:2px;letter-spacing:.02em;}

/* ---------- chapter grid ---------- */
.grid-chapters{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;
}
.chapter-tile{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:16px 14px;cursor:pointer;text-align:left;
  box-shadow:var(--shadow); transition:transform .15s ease, border-color .15s ease;
}
.chapter-tile:hover{transform:translateY(-2px);border-color:var(--jade);}
.chapter-tile .num{
  font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:var(--jade-deep);
  line-height:1;
}
.chapter-tile .label{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.35;}
.chapter-tile .prog{
  position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;
  color:var(--gold); background:#fff7e6;border:1px solid #ecd9a6;padding:2px 7px;border-radius:100px;
}

/* ---------- latihan list ---------- */
.latihan-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);
  transition:border-color .15s ease, transform .12s ease;
}
.latihan-row:hover{border-color:var(--jade);transform:translateX(2px);}
.latihan-row .l-left{display:flex;align-items:center;gap:14px;}
.latihan-badge{
  width:34px;height:34px;border-radius:9px;background:var(--jade);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;
  flex:none;
}
.latihan-title{font-weight:600;font-size:14.5px;}
.latihan-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.latihan-score{
  font-size:13px;font-weight:700;color:var(--jade-deep);background:#eef3f0;
  padding:5px 11px;border-radius:100px;border:1px solid #cfe0d8;white-space:nowrap;
}

/* ---------- quiz screen ---------- */
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
.quiz-meta{font-size:12.5px;color:var(--ink-soft);}
.quiz-meta b{color:var(--ink);}
.rings{display:flex;gap:4px;flex-wrap:wrap;max-width:230px;}
.ring{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;}
.ring.done{background:var(--jade);}
.ring.current{background:var(--gold);}

.answer-zone{
  min-height:78px;border:2px dashed var(--line);border-radius:12px;
  padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
  background:#fffef9;margin-bottom:18px;transition:border-color .15s ease;
}
.answer-zone.has-tiles{border-style:solid;border-color:var(--line);}
.answer-zone .placeholder{color:#B7AE99;font-size:13.5px;padding:6px 2px;}

.bank-zone{
  display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;min-height:56px;
}

.tile{
  font-family:'Noto Sans SC','PingFang SC',sans-serif;
  font-size:19px;font-weight:500;padding:10px 16px;border-radius:9px;
  background:#fff;border:1.5px solid var(--line);cursor:pointer;
  box-shadow:0 2px 0 rgba(34,41,58,.06);
  transition:transform .1s ease, box-shadow .1s ease, opacity .15s ease, background .15s ease;
  user-select:none;
}
.tile:hover{transform:translateY(-2px);box-shadow:0 5px 10px -4px rgba(34,41,58,.25);}
.tile:active{transform:translateY(0);}
.tile.in-answer{background:var(--jade);color:#fff;border-color:var(--jade-deep);}
.tile.in-answer:hover{background:var(--jade-deep);}
.tile:focus-visible{outline:2px solid var(--seal);outline-offset:2px;}

.quiz-actions{display:flex;gap:10px;justify-content:space-between;}
.quiz-actions .left-actions{display:flex;gap:10px;}

/* ---------- results screen ---------- */
.score-hero{
  text-align:center;padding:26px 20px 22px;border-radius:16px;
  background:linear-gradient(180deg,#fff,var(--paper-2));
  border:1px solid var(--line); box-shadow:var(--shadow); margin-bottom:22px;
}
.score-num{font-family:'Fraunces',serif;font-weight:700;font-size:58px;color:var(--jade-deep);line-height:1;}
.score-label{color:var(--ink-soft);font-size:13.5px;margin-top:6px;}
.score-tag{
  display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;
  padding:5px 14px;border-radius:100px;letter-spacing:.03em;
}
.tag-great{background:#e7f2ee;color:var(--jade-deep);}
.tag-ok{background:#fdf1de;color:#8a5a12;}
.tag-retry{background:#fbeceb;color:var(--seal);}

.review-item{
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  background:var(--card);
}
.review-item.wrong{border-color:#eccac8;background:#fff9f8;}
.review-item.correct{border-color:#cfe0d8;}
.review-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.review-num{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
.review-status{
  font-size:11px;font-weight:700;padding:2px 9px;border-radius:100px;
}
.review-status.correct{background:#e7f2ee;color:var(--jade-deep);}
.review-status.wrong{background:#fbeceb;color:var(--seal);}
.review-line{font-family:'Noto Sans SC',sans-serif;font-size:16.5px;margin:4px 0;}
.review-line .rl-label{font-family:'Inter',sans-serif;font-size:11px;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.06em;margin-right:8px;display:inline-block;min-width:64px;}
.review-line.your-wrong .rl-value{color:var(--seal);text-decoration:line-through;text-decoration-color:#e0aba9;}
.review-line.correct-answer .rl-value{color:var(--jade-deep);font-weight:600;}

.footer-note{
  text-align:center;color:var(--ink-soft);font-size:12px;margin-top:30px;line-height:1.6;
}
.hidden{display:none !important;}

@media (max-width:480px){
  .score-num{font-size:46px;}
  .tile{font-size:17px;padding:9px 13px;}
  h1.page-title{font-size:23px;}
}
</style>
</head>

<script>
(function(){
"use strict";

/* ============ STATE ============ */
const state = {
  student: { name: "", kelas: "" },
  chapter: null,
  latihan: null,
  questions: [],       // 20 question objects for current latihan
  qIndex: 0,
  bank: [],            // [{id, word, used}]
  answer: [],          // [id,...] in chosen order
  results: [],         // per-question record after each answer
  sessionScores: {},   // "ch-la" -> {score, mistakesCount}
};

const CHAPTER_COUNT = 15;
const LATIHAN_COUNT = 5;
const QUESTIONS_PER_LATIHAN = 20;

/* ============ HELPERS ============ */
function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffledDistinct(words){
  if (words.length <= 1) return words.slice();
  let tries = 0;
  let s = shuffle(words);
  while (s.join("|") === words.join("|") && tries < 12){
    s = shuffle(words);
    tries++;
  }
  return s;
}

function key(ch, la){ return ch + "-" + la; }

function scoreTag(score){
  if (score >= 80) return { cls: "tag-great", text: "Bagus sekali!" };
  if (score >= 55) return { cls: "tag-ok", text: "Lumayan, terus berlatih" };
  return { cls: "tag-retry", text: "Coba lagi ya" };
}

/* ============ RENDER: TOPBAR ============ */
function renderTopbar(container, opts){
  opts = opts || {};
  const bar = el("div", "topbar");
  const brand = el("div", "brand");
  brand.innerHTML = `
    <div class="seal cjk-display">词</div>
    <div class="brand-text">
      <div class="t1">HSK2 · Tata Bahasa</div>
      <div class="t2 display">Susun Hanzi</div>
    </div>`;
  bar.appendChild(brand);

  if (state.student.name){
    const chip = el("div", "student-chip");
    chip.innerHTML = `<span>👤</span> <b>${escapeHtml(state.student.name)}</b> · ${escapeHtml(state.student.kelas || "-")}`;
    bar.appendChild(chip);
  }
  container.appendChild(bar);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[m]));
}

/* ============ SCREEN 1: START (name + kelas) ============ */
function renderStart(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  renderTopbar(app);

  const card = el("div", "card");
  card.innerHTML = `
    <div class="hero-mark">
      <div class="glyphs cjk-display">给 才 把 得</div>
      <div class="sub">Latihan menyusun kata menjadi kalimat Mandarin yang benar tata bahasanya</div>
    </div>
    <h1 class="page-title" style="text-align:center;margin-top:18px;">Mulai Latihan</h1>
    <p class="page-sub" style="text-align:center;">Isi data kamu dulu ya, lalu pilih BAB tata bahasa yang mau dilatih.</p>
  `;

  const form = el("div", "");
  form.style.display = "grid";
  form.style.gap = "14px";
  form.style.maxWidth = "360px";
  form.style.margin = "0 auto";

  const f1 = el("div");
  f1.innerHTML = `<label class="field-label">Nama</label>`;
  const inputName = el("input", "field-input");
  inputName.placeholder = "Nama lengkap";
  inputName.value = state.student.name;
  f1.appendChild(inputName);

  const f2 = el("div");
  f2.innerHTML = `<label class="field-label">Asal Kelas</label>`;
  const inputKelas = el("input", "field-input");
  inputKelas.placeholder = "Contoh: HSK2 - A";
  inputKelas.value = state.student.kelas;
  f2.appendChild(inputKelas);

  const btn = el("button", "btn btn-primary btn-block", "Mulai Latihan &nbsp;→");
  btn.style.marginTop = "6px";
  btn.addEventListener("click", () => {
    const name = inputName.value.trim();
    const kelas = inputKelas.value.trim();
    if (!name || !kelas){
      warn.textContent = "Nama dan asal kelas wajib diisi dulu ya.";
      warn.style.display = "block";
      return;
    }
    state.student.name = name;
    state.student.kelas = kelas;
    renderChapters();
  });

  const warn = el("div", "", "");
  warn.style.color = "var(--seal)";
  warn.style.fontSize = "12.5px";
  warn.style.display = "none";

  form.appendChild(f1);
  form.appendChild(f2);
  form.appendChild(btn);
  form.appendChild(warn);
  card.appendChild(form);
  app.appendChild(card);

  const foot = el("div", "footer-note", "Setiap BAB berisi 5 latihan × 20 soal. Susun kata-kata yang tersedia menjadi kalimat Mandarin yang tepat.");
  app.appendChild(foot);
}

/* ============ SCREEN 2: CHAPTER GRID ============ */
function renderChapters(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  renderTopbar(app);

  const card = el("div", "card");
  const head = el("div");
  head.innerHTML = `<h1 class="page-title">Pilih BAB</h1><p class="page-sub">15 BAB tata bahasa HSK2. Ketuk salah satu untuk melihat latihannya.</p>`;
  card.appendChild(head);

  const grid = el("div", "grid-chapters");
  for (let c = 1; c <= CHAPTER_COUNT; c++){
    const chData = DATA[String(c)];
    const tile = el("button", "chapter-tile");
    tile.type = "button";

    // session progress badge: how many latihan completed for this chapter
    let done = 0;
    for (let l = 1; l <= LATIHAN_COUNT; l++){
      if (state.sessionScores[key(c,l)]) done++;
    }
    const progHtml = done > 0 ? `<div class="prog">${done}/5</div>` : "";

    tile.innerHTML = `
      ${progHtml}
      <div class="num display">${String(c).padStart(2,"0")}</div>
      <div class="label">${escapeHtml(chData.title)}</div>
    `;
    tile.addEventListener("click", () => renderLatihanList(c));
    grid.appendChild(tile);
  }
  card.appendChild(grid);
  app.appendChild(card);

  const foot = el("div", "footer-note", "Skor tiap latihan memakai skala 0–100. Kesalahan akan ditampilkan setelah selesai supaya kamu bisa belajar dari situ.");
  app.appendChild(foot);
}

/* ============ SCREEN 3: LATIHAN LIST ============ */
function renderLatihanList(chapterNum){
  const app = document.getElementById("app");
  app.innerHTML = "";
  renderTopbar(app);

  const chData = DATA[String(chapterNum)];

  const backRow = el("button", "btn btn-ghost btn-sm", "← Semua BAB");
  backRow.style.marginBottom = "14px";
  backRow.addEventListener("click", renderChapters);
  app.appendChild(backRow);

  const card = el("div", "card");
  card.innerHTML = `<h1 class="page-title">${escapeHtml(chData.title)}</h1><p class="page-sub">Pilih salah satu dari 5 latihan di bawah ini. Setiap latihan berisi 20 soal susun kata.</p>`;

  for (let l = 1; l <= LATIHAN_COUNT; l++){
    const laData = chData.latihan[String(l)];
    const row = el("div", "latihan-row");
    const rec = state.sessionScores[key(chapterNum, l)];
    row.innerHTML = `
      <div class="l-left">
        <div class="latihan-badge display">${l}</div>
        <div>
          <div class="latihan-title">Latihan ${l}</div>
          <div class="latihan-sub cjk">${escapeHtml(laData.title)}</div>
        </div>
      </div>
      ${rec ? `<div class="latihan-score">${rec.score}/100</div>` : `<div class="latihan-score" style="opacity:.55;background:#f2efe6;color:var(--ink-soft);border-color:var(--line);">20 soal</div>`}
    `;
    row.addEventListener("click", () => startQuiz(chapterNum, l));
    card.appendChild(row);
  }
  app.appendChild(card);
}

/* ============ QUIZ FLOW ============ */
function startQuiz(chapterNum, latihanNum){
  state.chapter = chapterNum;
  state.latihan = latihanNum;
  state.questions = DATA[String(chapterNum)].latihan[String(latihanNum)].questions;
  state.qIndex = 0;
  state.results = [];
  loadQuestion();
  renderQuiz();
}

function loadQuestion(){
  const q = state.questions[state.qIndex];
  const shuffledWords = shuffledDistinct(q.tiles);
  state.bank = shuffledWords.map((w, idx) => ({ id: "t" + idx + "_" + state.qIndex, word: w, used: false }));
  state.answer = [];
}

function currentAnswerWords(){
  return state.answer.map(id => state.bank.find(t => t.id === id).word);
}

// Pronoun / person-noun words. When a wrong answer differs from an accepted
// answer by swapping exactly two of these (e.g. subject <-> object/receiver),
// it is still counted correct: both orderings are valid instances of the same
// grammar pattern being drilled, just with the two people's roles reversed.
const PERSON_WORDS = new Set([
  "我","你","他","她","我们","你们","他们",
  "妈妈","爸爸","老师","哥哥","姐姐","弟弟","妹妹","朋友","同学","经理","医生"
]);

function isAnswerCorrect(userWords, question){
  const userStr = userWords.join("|");
  if (question.accepted.some(acc => acc.join("|") === userStr)) return true;

  // Leniency: subject/object (person-word) swapped, everything else identical.
  for (const acc of question.accepted){
    if (acc.length !== userWords.length) continue;
    const diffIdx = [];
    for (let i = 0; i < acc.length; i++){
      if (acc[i] !== userWords[i]) diffIdx.push(i);
      if (diffIdx.length > 2) break;
    }
    if (diffIdx.length === 2){
      const [i, j] = diffIdx;
      if (userWords[i] === acc[j] && userWords[j] === acc[i] &&
          PERSON_WORDS.has(acc[i]) && PERSON_WORDS.has(acc[j])){
        return true;
      }
    }
  }
  return false;
}

function renderQuiz(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  renderTopbar(app);

  const chData = DATA[String(state.chapter)];
  const laData = chData.latihan[String(state.latihan)];

  const backRow = el("button", "btn btn-ghost btn-sm", "← Batalkan latihan");
  backRow.style.marginBottom = "14px";
  backRow.addEventListener("click", () => {
    if (confirm("Yakin mau membatalkan latihan ini? Progres soal saat ini akan hilang.")) {
      renderLatihanList(state.chapter);
    }
  });
  app.appendChild(backRow);

  const card = el("div", "card");

  const top = el("div", "quiz-top");
  top.innerHTML = `
    <div class="quiz-meta">
      ${escapeHtml(chData.title)} · <b>Latihan ${state.latihan}</b><br>
      <span class="cjk">${escapeHtml(laData.title)}</span>
    </div>
  `;
  const rings = el("div", "rings");
  for (let i = 0; i < QUESTIONS_PER_LATIHAN; i++){
    const r = el("div", "ring");
    if (i < state.qIndex) r.classList.add("done");
    else if (i === state.qIndex) r.classList.add("current");
    rings.appendChild(r);
  }
  top.appendChild(rings);
  card.appendChild(top);

  const soalLabel = el("div", "", `<b style="font-size:13px;color:var(--ink-soft);">Soal ${state.qIndex+1} dari ${QUESTIONS_PER_LATIHAN}</b>`);
  soalLabel.style.marginBottom = "10px";
  card.appendChild(soalLabel);

  const instr = el("p", "page-sub", "Susun kotak kata di bawah menjadi kalimat Mandarin yang benar sesuai pola tata bahasa latihan ini. Ketuk kata untuk memindahkannya.");
  instr.style.marginBottom = "14px";
  instr.style.fontSize = "13.5px";
  card.appendChild(instr);

  // answer zone
  const answerZone = el("div", "answer-zone");
  card.appendChild(answerZone);

  // bank zone
  const bankZone = el("div", "bank-zone");
  card.appendChild(bankZone);

  function renderTiles(){
    answerZone.innerHTML = "";
    bankZone.innerHTML = "";
    answerZone.classList.toggle("has-tiles", state.answer.length > 0);

    if (state.answer.length === 0){
      const ph = el("span", "placeholder", "Susunan kalimat kamu akan muncul di sini…");
      answerZone.appendChild(ph);
    } else {
      state.answer.forEach(id => {
        const t = state.bank.find(x => x.id === id);
        const chip = el("button", "tile in-answer cjk", t.word);
        chip.type = "button";
        chip.addEventListener("click", () => {
          state.answer = state.answer.filter(x => x !== id);
          renderTiles();
          updateNextButton();
        });
        answerZone.appendChild(chip);
      });
    }

    state.bank.forEach(t => {
      if (state.answer.includes(t.id)) return;
      const chip = el("button", "tile cjk", t.word);
      chip.type = "button";
      chip.addEventListener("click", () => {
        state.answer.push(t.id);
        renderTiles();
        updateNextButton();
      });
      bankZone.appendChild(chip);
    });
  }
  renderTiles();

  // actions
  const actions = el("div", "quiz-actions");
  const leftActions = el("div", "left-actions");
  const resetBtn = el("button", "btn btn-ghost btn-sm", "↺ Ulang Susunan");
  resetBtn.addEventListener("click", () => {
    state.answer = [];
    renderTiles();
    updateNextButton();
  });
  leftActions.appendChild(resetBtn);
  actions.appendChild(leftActions);

  const isLast = state.qIndex === QUESTIONS_PER_LATIHAN - 1;
  const nextBtn = el("button", "btn btn-primary", isLast ? "Selesai & Lihat Nilai →" : "Soal Berikutnya →");
  nextBtn.id = "next-btn";
  nextBtn.addEventListener("click", handleNext);
  actions.appendChild(nextBtn);

  card.appendChild(actions);
  app.appendChild(card);

  function updateNextButton(){
    const btn = document.getElementById("next-btn");
    const total = state.bank.length;
    btn.disabled = state.answer.length !== total;
  }
  updateNextButton();
}

function handleNext(){
  const q = state.questions[state.qIndex];
  const userWords = currentAnswerWords();
  const correct = isAnswerCorrect(userWords, q);
  state.results.push({
    tiles: q.tiles.slice(),
    userWords: userWords,
    accepted: q.accepted,
    correct: correct,
  });

  if (state.qIndex < QUESTIONS_PER_LATIHAN - 1){
    state.qIndex++;
    loadQuestion();
    renderQuiz();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  const correctCount = state.results.filter(r => r.correct).length;
  const score = Math.round((correctCount / QUESTIONS_PER_LATIHAN) * 100);
  state.sessionScores[key(state.chapter, state.latihan)] = {
    score: score,
    mistakesCount: QUESTIONS_PER_LATIHAN - correctCount,
  };
  renderResults(score, correctCount);
}

/* ============ SCREEN 4: RESULTS ============ */
function renderResults(score, correctCount){
  const app = document.getElementById("app");
  app.innerHTML = "";
  renderTopbar(app);

  const chData = DATA[String(state.chapter)];
  const laData = chData.latihan[String(state.latihan)];
  const tag = scoreTag(score);

  const hero = el("div", "score-hero");
  hero.innerHTML = `
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:4px;">
      ${escapeHtml(chData.title)} · Latihan ${state.latihan} — <span class="cjk">${escapeHtml(laData.title)}</span>
    </div>
    <div class="score-num display">${score}</div>
    <div class="score-label">${correctCount} dari ${QUESTIONS_PER_LATIHAN} soal benar &nbsp;·&nbsp; skala 0–100</div>
    <div class="score-tag ${tag.cls}">${tag.text}</div>
  `;
  app.appendChild(hero);

  const actionsRow = el("div", "");
  actionsRow.style.display = "flex";
  actionsRow.style.gap = "10px";
  actionsRow.style.marginBottom = "22px";
  actionsRow.style.flexWrap = "wrap";

  const retryBtn = el("button", "btn btn-primary", "↺ Ulangi Latihan Ini");
  retryBtn.addEventListener("click", () => startQuiz(state.chapter, state.latihan));
  const otherBtn = el("button", "btn btn-ghost", "Latihan Lain di BAB Ini");
  otherBtn.addEventListener("click", () => renderLatihanList(state.chapter));
  const chBtn = el("button", "btn btn-ghost", "Ganti BAB");
  chBtn.addEventListener("click", renderChapters);

  actionsRow.appendChild(retryBtn);
  actionsRow.appendChild(otherBtn);
  actionsRow.appendChild(chBtn);
  app.appendChild(actionsRow);

  const mistakes = state.results.filter(r => !r.correct);

  const reviewCard = el("div", "card");
  if (mistakes.length === 0){
    reviewCard.innerHTML = `<h1 class="page-title" style="font-size:19px;">Sempurna! 🎉</h1><p class="page-sub">Tidak ada kesalahan sama sekali pada latihan ini. Mantap!</p>`;
  } else {
    reviewCard.innerHTML = `<h1 class="page-title" style="font-size:19px;">Yuk belajar dari kesalahan</h1><p class="page-sub">Berikut soal yang jawabanmu masih belum tepat, lengkap dengan susunan yang benar.</p>`;
    let n = 1;
    state.results.forEach((r) => {
      if (r.correct) return;
      const item = el("div", "review-item wrong");
      const correctAnswer = r.accepted[0].join(" ");
      item.innerHTML = `
        <div class="review-head">
          <span class="review-num">SOAL ${n}</span>
          <span class="review-status wrong">Belum tepat</span>
        </div>
        <div class="review-line your-wrong">
          <span class="rl-label">Jawabanmu</span>
          <span class="rl-value cjk">${escapeHtml(r.userWords.join(" "))}</span>
        </div>
        <div class="review-line correct-answer">
          <span class="rl-label">Yang benar</span>
          <span class="rl-value cjk">${escapeHtml(correctAnswer)}</span>
        </div>
      `;
      reviewCard.appendChild(item);
      n++;
    });
  }
  app.appendChild(reviewCard);

  const foot = el("div", "footer-note", `${escapeHtml(state.student.name)} · ${escapeHtml(state.student.kelas)} — hasil latihan hanya tersimpan selama sesi ini.`);
  app.appendChild(foot);
}

/* ============ INIT ============ */
renderStart();

})();

</script>
